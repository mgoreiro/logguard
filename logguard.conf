# /etc/logguard.conf - configuration for logguard
# Format: KEY=VALUE  (lines starting with # are ignored)

# Cleanup starts when free space (blocks OR inodes) of LOG_DIR drops below this.
MIN_FREE_PERCENT=15

# Cleanup keeps going until this much is free (hysteresis, avoids re-running every minute).
TARGET_FREE_PERCENT=25

LOG_DIR=/var/log

# Persistent location (NOT inside /var/log, NOT /var/log.hdd used by armbian-ramlog).
ARCHIVE_DIR=/var/lib/logguard/archive

# Archived batches older than this are deleted.
RETENTION_HOURS=24

# Do not archive if the archive filesystem has less free space than this.
ARCHIVE_MIN_FREE_MB=100

# gzip | none  (files already compressed are never recompressed)
COMPRESS=gzip

# Passed to `journalctl --vacuum-size` (only if /var/log/journal exists). Empty = skip.
JOURNAL_VACUUM_SIZE=20M

# Run `logrotate -f` as an extra step. Off by default: forcing rotation of
# copytruncate logs temporarily needs extra space on an almost-full filesystem.
LOGROTATE_FORCE=no

# Files that are not rotated but have not been modified for this many hours (e.g.
# sysstat's saNN/sarNN of previous days) are archived like rotated logs.
# Files open by a running process are never moved. 0 = disabled.
STALE_HOURS=24

# Last resort: save the tail of the biggest active TEXT logs and truncate them (binary files such as lastlog are never truncated).
TRUNCATE_ACTIVE=yes
TRUNCATE_MIN_KB=64
TAIL_KB=256

# Comma-separated fnmatch patterns (relative to LOG_DIR) that are never touched.
EXCLUDE=
